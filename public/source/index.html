<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved filing text · Contract Cliffs</title><link rel="stylesheet" href="/styles.css"><link rel="icon" href="data:,">
<style>ol{font-size:13px;padding-left:56px;color:var(--mute)}li{padding:2px 0}li span{color:var(--ink)}li.hl span{background:var(--hair)}</style></head>
<body><div class="wrap"><header style="padding:48px 0 24px"><div class="lab"><a href="/">Contract Cliffs</a> · saved filing text</div><h1 class="mark" id="t" style="font-size:32px;letter-spacing:.04em"></h1><p class="lede" id="m"></p></header><hr class="hair"><ol id="L"></ol></div>
<script type="module">
const p=new URLSearchParams(location.search),id=p.get('id'),a=+p.get('from')||0,b=+p.get('to')||a;
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d=(await (await fetch('/data/edgar.json')).json()).find(c=>c.id===id);
if(!d){document.getElementById('t').textContent='Not found';}else{
document.getElementById('t').textContent=d.title;
document.getElementById('m').innerHTML=`${e(d.filer)} · ${e(d.exhibit)} · filed ${e(d.filed)}. Text normalised from the EDGAR HTML (one line per block); line numbers match the app. Original: <a href="${e(d.url)}">${e(d.url)}</a>`;
document.getElementById('L').innerHTML=d.lines.map((l,i)=>`<li id="L${i+1}" class="${i+1>=a&&i+1<=b?'hl':''}"><span>${e(l)}</span></li>`).join('');
if(a)document.getElementById('L'+a)?.scrollIntoView({block:'center'});}
</script></body></html>
